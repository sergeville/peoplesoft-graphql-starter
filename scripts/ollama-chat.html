<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ollama Chat</title>
  <style>
    :root { color-scheme: dark light; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #0f1419; color: #e7ecf3; }
    header { padding: 0.75rem 1rem; border-bottom: 1px solid #2a3441; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header label { font-size: 0.8rem; color: #9aa7b8; display: flex; align-items: center; gap: 0.35rem; }
    select, input[type=text] { background: #171d26; border: 1px solid #2a3441; color: #e7ecf3; border-radius: 8px; padding: 0.35rem 0.5rem; font-size: 0.85rem; }
    #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { max-width: 85%; padding: 0.65rem 0.85rem; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #1e3a5f; border: 1px solid #2563eb55; }
    .assistant { align-self: flex-start; background: #171d26; border: 1px solid #2a3441; }
    .system { align-self: center; font-size: 0.8rem; color: #7d8da3; background: transparent; border: none; padding: 0.25rem; }
    .err { align-self: center; color: #ff8a8a; font-size: 0.85rem; }
    footer { border-top: 1px solid #2a3441; padding: 0.75rem 1rem; display: flex; gap: 0.5rem; }
    #input { flex: 1; min-height: 2.5rem; max-height: 8rem; resize: vertical; background: #171d26; border: 1px solid #2a3441; color: #e7ecf3; border-radius: 10px; padding: 0.6rem 0.75rem; font: inherit; }
    button { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 0.55rem 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #2a3441; color: #c8d3e0; }
  </style>
</head>
<body>
  <header>
    <h1>Ollama Chat</h1>
    <label>Model <select id="model"></select></label>
    <label>API <input id="api" type="text" size="28" value="http://127.0.0.1:11434" /></label>
    <span id="status" style="font-size:0.8rem;color:#9aa7b8"></span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="input" rows="2" placeholder="Message Ollama… (Enter to send, Shift+Enter newline)"></textarea>
    <button id="send">Send</button>
    <button id="clear" class="secondary" type="button">Clear</button>
  </footer>
  <script>
    const params = new URLSearchParams(location.search);
    const defaultApi = params.get("ollama") || "http://127.0.0.1:11434";
    document.getElementById("api").value = defaultApi;

    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSel = document.getElementById("model");
    const statusEl = document.getElementById("status");
    const messages = [];
    const systemPrompt = "You are Ollama on Serge's Mac. When the user says Cursor, they mean the Cursor IDE editor (Anysphere)—not the mouse pointer. The Cursor agent can call you via the Ollama API. Be concise.";

    function apiBase() {
      return document.getElementById("api").value.replace(/\/$/, "");
    }

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function loadModels() {
      statusEl.textContent = "Loading models…";
      try {
        const res = await fetch(apiBase() + "/api/tags");
        const data = await res.json();
        modelSel.innerHTML = "";
        (data.models || []).forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m.name;
          opt.textContent = m.name;
          modelSel.appendChild(opt);
        });
        const preferred = params.get("model") || "llama3.2:latest";
        if ([...modelSel.options].some((o) => o.value === preferred)) modelSel.value = preferred;
        statusEl.textContent = "Ready";
      } catch (e) {
        statusEl.textContent = "Cannot reach Ollama";
        addMsg("err", "Failed to load models: " + e.message);
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendBtn.disabled = true;
      addMsg("user", text);
      const userMsg = { role: "user", content: text };
      if (messages.length === 0) {
        messages.push({ role: "system", content: systemPrompt });
      }
      messages.push(userMsg);
      const bubble = addMsg("assistant", "…");

      try {
        const res = await fetch(apiBase() + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: modelSel.value, messages, stream: true }),
        });
        if (!res.ok) throw new Error(await res.text());
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = "";
        bubble.textContent = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          for (const line of decoder.decode(value, { stream: true }).split("\n")) {
            if (!line.trim()) continue;
            const chunk = JSON.parse(line);
            full += chunk.message?.content || "";
            bubble.textContent = full;
            log.scrollTop = log.scrollHeight;
            if (chunk.done) break;
          }
        }
        messages.push({ role: "assistant", content: full });
      } catch (e) {
        bubble.remove();
        addMsg("err", e.message);
        messages.pop();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    document.getElementById("clear").addEventListener("click", () => {
      messages.length = 0;
      log.innerHTML = "";
      addMsg("system", "Chat cleared. Cursor agent is separate — this page talks to Ollama on your Mac.");
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    addMsg("system", "Browser chat → Ollama (local). Cursor chat stays in the IDE.");
    loadModels();
    input.focus();
  </script>
</body>
</html>
